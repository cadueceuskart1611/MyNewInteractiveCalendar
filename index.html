<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Multi-Task Planner</title>
    <style>
        /* CSS: Styles the calendar layout, colors, and grid */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            padding: 20px;
            max-width: 1200px; /* Widened to fit 3 boxes comfortably */
            margin: 0 auto;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        select {
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #d2d2d7;
            background-color: white;
        }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            background-color: #e8e8ed;
            padding: 10px 0;
            border-radius: 8px 8px 0 0;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #d2d2d7;
            border: 1px solid #d2d2d7;
            border-radius: 0 0 8px 8px;
            overflow: hidden;
        }
        .day-box {
            background-color: white;
            min-height: 140px; /* Taller box to house 3 text areas */
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .day-number {
            font-weight: 600;
            margin-bottom: 2px;
            font-size: 14px;
        }
        /* Styles for the 3 individual text boxes */
        .day-box textarea {
            width: 100%;
            height: 28px;
            border: 1px solid #e8e8ed;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 12px;
            resize: none;
            outline: none;
            box-sizing: border-box;
            background-color: #fafafa;
        }
        .day-box textarea:focus {
            border-color: #0071e3;
            background-color: white;
        }
        .empty-box {
            background-color: #f5f5f7;
        }
    </style>
</head>
<body>

    <h1>Interactive Planning Calendar</h1>

    <!-- HTML: Dropdowns for selecting month and year -->
    <div class="controls">
        <select id="monthSelect"></select>
        <select id="yearSelect"></select>
    </div>

    <!-- HTML: Header rows for days of the week -->
    <div class="weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>

    <!-- HTML: The grid layout dynamically populated by JavaScript -->
    <div id="calendarGrid" class="calendar-grid"></div>

    <script>
        // JAVASCRIPT: The engine that replaces your Numbers formulas
        const monthSelect = document.getElementById('monthSelect');
        const yearSelect = document.getElementById('yearSelect');
        const calendarGrid = document.getElementById('calendarGrid');

        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const currentYear = new Date().getFullYear();

        // 1. Populate the month dropdown
        months.forEach((month, index) => {
            let opt = document.createElement('option');
            opt.value = index;
            opt.textContent = month;
            monthSelect.appendChild(opt);
        });

        // 2. Populate the year dropdown all the way to 2200
        for (let y = 2020; y <= 2200; y++) {
            let opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            yearSelect.appendChild(opt);
        }

        // Set default dropdown values to today's current date
        monthSelect.value = new Date().getMonth();
        yearSelect.value = currentYear;

        // 3. Core Function: Re-calculates and renders the grid dynamically
        function generateCalendar() {
            calendarGrid.innerHTML = ''; // Clear previous view
            
            const selectedMonth = parseInt(monthSelect.value);
            const selectedYear = parseInt(yearSelect.value);

            // Replicates finding the first weekday of the month
            const firstDayIndex = new Date(selectedYear, selectedMonth, 1).getDay();
            // Replicates calculating total days in a given month
            const totalDays = new Date(selectedYear, selectedMonth + 1, 0).getDate();

            // Render empty spacer boxes for days belonging to the trailing month
            for (let i = 0; i < firstDayIndex; i++) {
                let emptyDiv = document.createElement('div');
                emptyDiv.classList.add('day-box', 'empty-box');
                calendarGrid.appendChild(emptyDiv);
            }

            // Render active visible days with 3 unique textareas per day
            for (let day = 1; day <= totalDays; day++) {
                let dayDiv = document.createElement('div');
                dayDiv.classList.add('day-box');

                // Generate 3 unique storage keys for each individual box
                const key1 = `note-${selectedYear}-${selectedMonth}-${day}-t1`;
                const key2 = `note-${selectedYear}-${selectedMonth}-${day}-t2`;
                const key3 = `note-${selectedYear}-${selectedMonth}-${day}-t3`;

                // Retrieve any previously saved user input from browser memory
                const text1 = localStorage.getItem(key1) || '';
                const text2 = localStorage.getItem(key2) || '';
                const text3 = localStorage.getItem(key3) || '';

                dayDiv.innerHTML = `
                    <div class="day-number">${day}</div>
                    <textarea placeholder="Task 1..." id="${key1}">${text1}</textarea>
                    <textarea placeholder="Task 2..." id="${key2}">${text2}</textarea>
                    <textarea placeholder="Task 3..." id="${key3}">${text3}</textarea>
                `;

                calendarGrid.appendChild(dayDiv);

                // Add active instant-save listeners to all 3 text areas
                dayDiv.querySelectorAll('textarea').forEach(textarea => {
                    textarea.addEventListener('input', (e) => {
                        localStorage.setItem(e.target.id, e.target.value);
                    });
                });
            }
        }

        // Instantly recalculate grid layout whenever a dropdown changes
        monthSelect.addEventListener('change', generateCalendar);
        yearSelect.addEventListener('change', generateCalendar);

        // Run the builder automatically upon opening the website
        generateCalendar();
    </script>
</body>
</html>
